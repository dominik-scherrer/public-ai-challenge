name: CI

on:
  push:
    branches: [main, master, "feat/*", "fix/*", service-implementation]
  pull_request:

permissions:
  contents: read

jobs:
  scout:
    name: Scout (Ingestion)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/scout
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Type check with mypy
        run: uv run mypy src tests
      - name: Run tests with coverage
        run: uv run pytest --cov=scout tests/

  judge:
    name: Judge (Quality Gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/judge
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Type check with mypy
        run: uv run mypy src tests
      - name: Run tests with coverage
        run: uv run pytest --cov=judge tests/
