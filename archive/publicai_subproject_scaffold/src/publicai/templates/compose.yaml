services:
  municipality:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [snapshot]
    restart: unless-stopped

networks:
  snapshot:
    internal: true
