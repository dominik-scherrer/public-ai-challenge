[project]
name = "municipality-scout"
version = "0.1.0"
description = "Adaptive municipal discovery and semantic compilation for the Swiss Public AI challenge"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.13.0,<3",
  "pydantic-ai>=2.49.0,<3",
]

[project.scripts]
scout = "scout.app:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.uv.build-backend]
module-name = "scout"
