[project]
name = "publicai"
version = "0.1.0"
description = "Evidence-backed municipality MCP server factory"
readme = "README.md"
authors = [
    { name = "Patrick Arnecke", email = "mail@arnecke.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "anyio",
    "httpcore",
    "httpx",
    "logfire",
    "mcp",
    "openai",
    "pydantic",
    "pydantic-ai-slim[openai]",
    "python-dotenv",
    "pyyaml",
    "rich",
    "typer",
]

[project.scripts]
publicai = "publicai:main"
factory = "publicai.cli:app"
municipality-mcp = "publicai.runtime:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
extend-exclude = [".agents", ".codex", "artifacts", "ideas-patrick"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
