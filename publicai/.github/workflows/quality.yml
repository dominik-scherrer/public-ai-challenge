name: quality
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.12.16-python3.14-bookworm-slim
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: uv sync --frozen
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest
      - name: Verify generated package with only its locked dependencies
        run: |
          runtime_package="$(uv run --frozen python -c 'from pathlib import Path; from publicai.builder import build; print(build(Path("src/publicai/fixtures/representative.json"), Path("/tmp/publicai-runtime-check")))')"
          uv sync --frozen --project "$runtime_package"
          uv run --frozen --project "$runtime_package" pytest "$runtime_package/tests"
          uv run --frozen --project "$runtime_package" municipality-mcp --discovery "$runtime_package/discovery.json" --check
      - name: Audit locked dependencies
        run: uvx --from pip-audit==2.9.0 pip-audit --disable-pip --no-deps --path .venv/lib/python3.14/site-packages

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build --tag publicai-factory:ci .
      - name: Scan container for high-severity vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.62.1 image --exit-code 1 --severity HIGH,CRITICAL publicai-factory:ci
