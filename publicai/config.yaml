# Model API connections are separate from website retrieval permissions.
# Website tools are hard restricted to www.ausserberg.ch in crawler.py.
# Discovery can search OpenAI's index; live evidence still uses the restricted crawler.
web_search_enabled: true
model:
  provider: openai
  discovery_model: gpt-6-sol
  review_model: gpt-6-luna
  temperature: null
  reasoning_effort: low
  max_tokens: 32000
  timeout: 120
  retries: 2
  request_limit: 24
  tool_calls_limit: 80
  total_tokens_limit: 250000
run_timeout: 600
crawl:
  max_requests: 100
  concurrency: 2
  run_timeout: 600
  request_timeout: 10
  max_redirects: 5
  max_bytes: 5242880
telemetry:
  enabled: false
  send_to_logfire: false
  service_name: municipality-factory
