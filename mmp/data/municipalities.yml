# Municipalities the builder knows how to reach — the 19 sampled in
# ideas/mmp-swiss-municipality-service-research.md.
#
# bfs: BFS-Gemeindenummer, the address of a Service Inventory (ADR-0003).
#   Only filled where it was checked against a source (Wikipedia "SFOS number"
#   / schweizer-regionen.ch, 2026-09-24). `null` = not yet verified: fill it in
#   from https://www.agvchapp.bfs.admin.ch before building that municipality.
# official_domains: the Municipality's own domains. Links and Handoffs may only
#   point here or to the operator allow-list in handoff_allowlist.yml (ADR-0007).
# robots_blocked: from the research report; the crawler respects robots.txt,
#   so these need a browser capture or the municipality's consent.
