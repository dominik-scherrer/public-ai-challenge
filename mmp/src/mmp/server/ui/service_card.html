<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMP Service Card</title>
<!--
  The MMP Service Card — an MCP App view (io.modelcontextprotocol/ui, spec 2026-01-26).
  One standardized view of a Service, shipped by the MMP server as ui://mmp/service-card.html
  and rendered identically by any MCP Apps host (Reference Client, Claude, ChatGPT; ADR-0006).

  Protocol used (JSON-RPC 2.0 over postMessage with the host):
    view -> host  ui/initialize, ui/notifications/initialized, ui/notifications/size-changed,
                  ui/open-link, tools/call (send_feedback)
    host -> view  ui/notifications/tool-input, ui/notifications/tool-result,
                  ui/notifications/host-context-changed
  Citizen context (children, a mentioned separation, move date) arrives ONLY via the host
  context key "mmp" — it never goes to the MMP server (ADR-0005). Hosts that don't send it
  get the neutral card.
  No network access of its own: everything comes from the tool result.
-->
<style>
:root{--ink:#1b1b1a;--muted:#5a5852;--line:#d9d6ce;--soft:#ebe8e1;--bg:#f6f5f1;--card:#fff;--blue:#1f4e79;--blue-d:#163a5a;--blue-s:#e6eef5;--red:#6e1616;--red-s:#fbeaea;--amber:#5c3900;--amber-s:#fff1d6}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--ink:#ecebe7;--muted:#b3b0a8;--line:#3b3a36;--soft:#2e2d2a;--bg:#1c1c1a;--card:#252523;--blue:#8db8e0;--blue-d:#b5d2ee;--blue-s:#1e3246;--red:#f3b9b9;--red-s:#3d2020;--amber:#f3d49a;--amber-s:#3a2e14}}
:root[data-theme=dark]{--ink:#ecebe7;--muted:#b3b0a8;--line:#3b3a36;--soft:#2e2d2a;--bg:#1c1c1a;--card:#252523;--blue:#8db8e0;--blue-d:#b5d2ee;--blue-s:#1e3246;--red:#f3b9b9;--red-s:#3d2020;--amber:#f3d49a;--amber-s:#3a2e14}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:transparent;color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
.card{display:flex;flex-direction:column;gap:16px;padding:18px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px}
.badge.way{color:#fff;background:var(--blue)}
.badge.info{color:var(--muted);background:var(--soft)}
h1{margin:0;font-size:24px;line-height:1.2;font-weight:700}
.sub{font-size:14px;color:var(--muted)}
.deadline{display:flex;flex-direction:column;gap:2px;padding:12px;background:var(--red-s);border-radius:10px;color:var(--red)}
.deadline b{font-size:16px}
.section{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--soft)}
.section:first-of-type{border-top:0;padding-top:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-head span{font-weight:600}
.src{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;background:none;border:0;color:var(--blue);padding:4px;text-decoration:underline}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ul.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--blue);flex-shrink:0}
.cond{font-size:13px;color:var(--muted)}
.why{font-size:13px;color:var(--muted);margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 10px;font-size:13px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv{display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:13px;color:var(--muted)}
.kv .v{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.withheld{padding:10px 12px;background:var(--amber-s);color:var(--amber);border-radius:10px;font-size:13px}
.act{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:16px}
.primary{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:600}
.secondary{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:15px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:12px 4px 0}
.link-btn{background:none;border:0;color:var(--blue);text-decoration:underline;padding:6px;font-size:13px}
.hidden{display:none!important}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card);color:var(--ink)}
.field.pre input{border:2px solid var(--blue);background:var(--blue-s)}
.tag{font-size:12px;color:var(--blue)}
.urlbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--soft);border-radius:10px 10px 0 0;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.okbox{display:flex;gap:10px;padding:12px;background:var(--blue-s);color:var(--blue-d);border-radius:10px;font-size:13px}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
@media print{.act,.foot,.link-btn,.src,.seg,#handoff,#feedback{display:none!important}.card{border:0}body{color:#000}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="sub" style="padding:16px">Service wird geladen …</p></main>

<script>
(() => {
  "use strict";
  const PROTOCOL = "2026-01-26";
  let nextId = 1;
  const pending = new Map();
  let ctx = {};          // host context ("mmp" key: situation, matched_documents, prefill)
  let data = null;       // tool result structuredContent
  let audience = null;   // "swiss" | "foreign"

  // ---- JSON-RPC over postMessage --------------------------------------------------------
  function send(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      const p = pending.get(msg.id); pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") { data = msg.params && msg.params.structuredContent; render(); }
    else if (msg.method === "ui/notifications/host-context-changed") { Object.assign(ctx, msg.params || {}); applyTheme(); render(); }
    else if (msg.method === "ui/resource-teardown" && msg.id !== undefined) { send({ jsonrpc: "2.0", id: msg.id, result: {} }); }
  });

  function applyTheme() { if (ctx.theme) document.documentElement.dataset.theme = ctx.theme; }
  const mmp = () => ctx.mmp || {};
  const situation = () => mmp().situation || {};

  // ---- helpers ------------------------------------------------------------------------------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  function sourceUrl(evidence) {
    const id = evidence && evidence[0] && evidence[0].source_id;
    const s = (data.sources || []).find((x) => x.id === id);
    return s ? s.url : null;
  }
  function srcButton(evidence) {
    const url = sourceUrl(evidence);
    return url ? `<button class="src" data-open="${esc(url)}" aria-label="Quelle öffnen">Quelle ↗</button>` : "";
  }
  function money(fee) { return Number(fee.amount) === 0 ? "gratis" : `CHF ${Number(fee.amount).toFixed(2)}`; }
  function dueText(deadline) {
    const move = situation().move_date;
    if (!move || !["move_in", "move_out"].includes(deadline.relative_to)) return null;
    const d = new Date(move + "T12:00:00"); d.setDate(d.getDate() + Number(deadline.days));
    return `Bis ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }
  let lastHeight = 0;
  function resize() {
    // Measure the content, not the document: documentElement never shrinks below the iframe's own height.
    const h = Math.ceil(document.getElementById("app").getBoundingClientRect().height);
    if (h === lastHeight) return;
    lastHeight = h;
    notify("ui/notifications/size-changed", { width: document.documentElement.clientWidth, height: h });
  }

  // ---- checklist logic (client-side only: ADR-0005) -------------------------------------------
  function classify(docs) {
    const sit = situation();
    const matched = new Map((mmp().matched_documents || []).map((m) => [m.id, m.reason]));
    const aud = audience || sit.nationality || "swiss";
    const hasKids = Number(sit.children) > 0;
    const out = { self: [], kids: [], maybe: [] };
    for (const d of docs) {
      if (d.audience !== "all" && d.audience !== aud) continue;
      const isMatched = matched.has(d.id);
      if (d.condition && !isMatched) { out.maybe.push(d); continue; }
      if (d.applies_to === "child") { (hasKids || isMatched ? out.kids : out.maybe).push({ ...d, reason: matched.get(d.id) }); continue; }
      out.self.push({ ...d, reason: matched.get(d.id) });
    }
    return out;
  }
  function items(list, withCond) {
    return `<ul class="check">${list.map((d, i) => `
      <li><label><input type="checkbox" id="c-${esc(d.id)}-${i}">
        <span>${esc(d.label)}${withCond && d.condition ? ` <span class="cond">– nur ${esc(d.condition)}</span>` : ""}</span></label></li>`).join("")}</ul>`;
  }

  // ---- views ------------------------------------------------------------------------------------
  function render() {
    const app = document.getElementById("app");
    if (!data || !data.service) { return; }
    const s = data.service, m = data.municipality, b = data.build, sit = situation();
    const ech = s.ech0070 && s.ech0070.status === "mapped" ? `eCH-0070 · ${esc(s.ech0070.id)}` : "eCH-0070 · nicht zugeordnet";
    const docs = s.documents || [];
    const hasAudiences = docs.some((d) => d.audience === "swiss") && docs.some((d) => d.audience === "foreign");
    const groups = classify(docs);
    const kids = Number(sit.children) || 0;
    const reasons = [...new Set([...groups.self, ...groups.kids].map((d) => d.reason).filter(Boolean))];
    const docEvidence = docs.length ? docs[0].evidence : null;
    const handoffs = s.handoffs || [];
    const online = handoffs.find((h) => h.url);
    const others = handoffs.filter((h) => h !== online);
    const prefill = mmp().prefill || {};
    const preFields = online ? (online.fields || []).filter((f) => prefill[f.key]) : [];
    const oh = s.opening_hours;
    const primaryId = ((s.summary_evidence && s.summary_evidence[0]) || (s.deadline && s.deadline.evidence[0]) || {}).source_id;
    const firstSource = (data.sources || []).find((x) => x.id === primaryId) || (data.sources || [])[0];
    const due = s.deadline ? dueText(s.deadline) : null;

    app.innerHTML = `
    <section id="main">
      <article class="card" aria-labelledby="t">
        <div class="row">
          <span class="badge ${s.tier === "wayfinding" ? "way" : "info"}">${s.tier === "wayfinding" ? "Wegweiser" : "Information"}</span>
          <span class="mono">${ech} · BFS ${esc(m.bfs)}</span>
        </div>
        <div>
          <h1 id="t">${esc(s.title)}</h1>
          <div class="sub">${esc((s.responsible && s.responsible.office) || m.name)} · ${esc(m.name)}</div>
        </div>
        ${s.deadline ? `<div class="deadline"><span style="font-size:13px">Frist</span><b>${due ? `${esc(due)} – ` : ""}${esc(s.deadline.label)}</b></div>` : ""}
        ${s.summary ? `<p style="margin:0">${esc(s.summary)} ${srcButton(s.summary_evidence)}</p>` : ""}
        ${hasAudiences ? `<div class="row"><span class="sub">Staatsangehörigkeit:</span>
          <div class="seg" role="group" aria-label="Staatsangehörigkeit">
            <button data-aud="swiss" aria-pressed="${(audience || sit.nationality || "swiss") === "swiss"}">Schweiz</button>
            <button data-aud="foreign" aria-pressed="${(audience || sit.nationality || "swiss") === "foreign"}">Andere</button>
          </div></div>` : ""}
        ${groups.self.length ? `<div class="section">
          <div class="section-head"><span>Mitbringen – für Sie</span>${srcButton(docEvidence)}</div>
          ${items(groups.self, false)}</div>` : ""}
        ${groups.kids.length ? `<div class="section">
          <div class="section-head"><span>Zusätzlich – für ${kids ? `Ihre ${kids} Kind${kids === 1 ? "" : "er"}` : "Ihre Kinder"}</span>${srcButton(groups.kids[0].evidence)}</div>
          ${items(groups.kids, false)}
          ${reasons.map((r) => `<p class="why">${esc(r)}</p>`).join("")}</div>` : ""}
        ${groups.maybe.length ? `<details class="section"><summary style="cursor:pointer;font-weight:600">Nur falls zutreffend (${groups.maybe.length})</summary>
          ${items(groups.maybe, true)}</details>` : ""}
        ${(s.fees || []).length || oh || s.responsible ? `<div class="section grid">
          <div class="kv"><span class="k">Gebühr</span>${(s.fees || []).length
              ? (s.fees).map((f) => `<span class="v">${esc(f.label)}: ${money(f)}${f.unit ? ` <span class="sub">(${esc(f.unit)})</span>` : ""}</span>`).join("")
              : `<span class="v">Keine Angabe auf ${esc(m.official_domains[0])}</span>`}</div>
          <div class="kv"><span class="k">${oh ? `Schalter · ${esc(oh.office)}` : "Kontakt"}</span>${oh
              ? oh.entries.map((e) => `<span class="v">${esc(e.days)}: ${e.times.map(esc).join(", ")}</span>`).join("") + (oh.note ? `<span class="sub">${esc(oh.note)}</span>` : "")
              : ""}
            ${s.responsible && s.responsible.phone ? `<span class="v"><a href="tel:${esc(s.responsible.phone.replace(/\s/g, ""))}" data-open="tel:${esc(s.responsible.phone.replace(/\s/g, ""))}">${esc(s.responsible.phone)}</a></span>` : ""}
            ${s.responsible && s.responsible.email ? `<span class="v"><a href="mailto:${esc(s.responsible.email)}" data-open="mailto:${esc(s.responsible.email)}">${esc(s.responsible.email)}</a></span>` : ""}
          </div></div>` : ""}
        ${(s.withheld || []).length ? `<div class="withheld" role="note">Nicht angezeigt, weil nicht belegbar: ${s.withheld.map((w) => esc(fieldLabel(w.field))).join(", ")}. Bitte bei der Gemeinde nachfragen.</div>` : ""}
      </article>

      ${online || others.length ? `<div class="act">
        <span style="font-weight:600">${online ? "Online erledigen" : "So erledigen Sie es"}</span>
        ${online ? `<span class="sub">${preFields.length
            ? `Ich übergebe nur, was Sie mir gesagt haben: ${preFields.map((f) => esc(f.label)).join(", ")}. Absenden tun Sie selbst – ${online.kind === "eumzug" ? "bei eUmzug" : "im Online-Schalter der Gemeinde"}.`
            : `Absenden tun Sie selbst – ${online.kind === "eumzug" ? "bei eUmzug" : "im Online-Schalter der Gemeinde"}.`}</span>
          <button class="primary" id="go">${online.kind === "eumzug" ? "Mit eUmzug melden" : "Im Online-Schalter öffnen"} <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h7v7M13 3L4 12"/></svg></button>` : ""}
        ${others.map((h) => `<span class="sub">• ${esc(h.label)}</span>`).join("")}
        ${docs.length ? `<button class="secondary" id="print">Checkliste als PDF speichern</button>` : ""}
      </div>` : ""}

      <p class="foot">Quelle: ${firstSource ? esc(firstSource.url.replace(/^https?:\/\//, "")) : esc(m.website)} · abgerufen ${firstSource ? esc(firstSource.retrieved_at.slice(0, 10)) : "–"} · ${b.verified_by_municipality ? "von der Gemeinde geprüft" : "nicht von der Gemeinde geprüft"}${b.judge === "passed" ? " · vom Judge geprüft" : " · Judge-Prüfung ausstehend"}<br>
        <button class="link-btn" id="fb">Feedback zu dieser Auskunft</button></p>
      <div id="feedback" class="act hidden">
        <label for="fbt" style="font-weight:600">Feedback an den MMP-Betreiber</label>
        <textarea id="fbt" maxlength="600" placeholder="Was stimmt nicht oder fehlt?"></textarea>
        <span class="sub">Gesendet wird genau dieser Text – an den MMP-Betreiber, nicht an die Gemeinde, ohne Ihren Namen oder den Chatverlauf. Bitte keine persönlichen Angaben.</span>
        <div class="row"><button class="primary" id="fbsend" style="flex:1;min-height:44px">Senden</button><button class="secondary" id="fbcancel">Abbrechen</button></div>
        <span id="fbmsg" class="sub" role="status"></span>
      </div>
    </section>
    ${online ? handoffView(online, prefill) : ""}`;

    wire(online);
    resize();
  }

  function fieldLabel(field) {
    const base = field.split("[")[0];
    return ({ fees: "Gebühr", documents: "Unterlage", handoffs: "Link/Formular", deadline: "Frist", opening_hours: "Öffnungszeiten", responsible: "Kontakt", summary: "Beschreibung" })[base] || base;
  }

  function handoffView(h, prefill) {
    const url = new URL(h.url);
    const fields = h.fields || [];
    const filled = fields.filter((f) => prefill[f.key]);
    return `<section id="handoff" class="hidden" aria-label="Handoff">
      <div class="urlbar"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="6" width="10" height="7" rx="1"/><path d="M4.5 6V4a2.5 2.5 0 015 0v2"/></svg>${esc(url.host + url.pathname)}</div>
      <div class="card" style="border-radius:0 0 16px 16px">
        <div class="okbox"><span>${filled.length ? `${filled.length} Angabe${filled.length === 1 ? "" : "n"} vom Assistenten vorbereitet – nur, was Sie selbst gesagt haben. Bitte prüfen, im Formular einsetzen und selbst absenden.` : "Keine Angaben vorbereitet. Sie füllen das Formular selbst aus."}</span></div>
        <h1 style="font-size:22px;font-weight:500">${esc(h.label)}</h1>
        ${fields.map((f, i) => `<div class="field ${prefill[f.key] ? "pre" : ""}">
            <label for="hf${i}">${esc(f.label)}</label>
            <input id="hf${i}" value="${esc(prefill[f.key] || "")}" ${prefill[f.key] ? "" : 'placeholder="Im Formular selbst eintragen"'}>
            ${prefill[f.key] ? `<span class="row"><span class="tag">Vorbereitet</span><button class="link-btn" data-copy="hf${i}">Kopieren</button></span>` : ""}
          </div>`).join("")}
        <p class="sub" style="margin:0">Das Formular von ${esc(url.host)} lässt sich (noch) nicht direkt vorausfüllen. Name und Adresse geben Sie dort selbst ein – der Assistent sieht sie nie.</p>
        <button class="primary" id="open-handoff">Weiter zu ${esc(url.host)} <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h7v7M13 3L4 12"/></svg></button>
        <button class="secondary" id="back">Zurück zur Service Card</button>
      </div></section>`;
  }

  function show(id) {
    for (const s of ["main", "handoff"]) { const el = document.getElementById(s); if (el) el.classList.toggle("hidden", s !== id); }
    window.scrollTo(0, 0); resize();
  }

  function wire(online) {
    document.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); openLink(el.dataset.open); }));
    document.querySelectorAll("[data-aud]").forEach((el) => el.addEventListener("click", () => { audience = el.dataset.aud; render(); }));
    const go = document.getElementById("go"); if (go) go.addEventListener("click", () => show("handoff"));
    const back = document.getElementById("back"); if (back) back.addEventListener("click", () => show("main"));
    const oh = document.getElementById("open-handoff"); if (oh) oh.addEventListener("click", () => openLink(online.url));
    document.querySelectorAll("[data-copy]").forEach((el) => el.addEventListener("click", async () => {
      const input = document.getElementById(el.dataset.copy);
      try { await navigator.clipboard.writeText(input.value); el.textContent = "Kopiert"; } catch { input.select(); el.textContent = "Markiert – Strg/Cmd+C"; }
    }));
    const pr = document.getElementById("print"); if (pr) pr.addEventListener("click", () => window.print());
    const fb = document.getElementById("fb"), box = document.getElementById("feedback");
    if (fb) fb.addEventListener("click", () => { box.classList.remove("hidden"); resize(); document.getElementById("fbt").focus(); });
    const cancel = document.getElementById("fbcancel"); if (cancel) cancel.addEventListener("click", () => { box.classList.add("hidden"); resize(); });
    const sendBtn = document.getElementById("fbsend");
    if (sendBtn) sendBtn.addEventListener("click", async () => {
      const text = document.getElementById("fbt").value.trim(), out = document.getElementById("fbmsg");
      if (text.length < 3) { out.textContent = "Bitte ein paar Worte schreiben."; return; }
      sendBtn.disabled = true;
      try {
        const r = await request("tools/call", { name: "send_feedback", arguments: { bfs: data.municipality.bfs, service_id: data.service.id, message: text } });
        out.textContent = r && r.isError ? (r.content && r.content[0] && r.content[0].text) || "Nicht gesendet." : "Danke – gesendet.";
        if (!(r && r.isError)) document.getElementById("fbt").value = "";
      } catch (e) { out.textContent = "Dieser Host erlaubt kein Feedback aus der Karte."; }
      sendBtn.disabled = false; resize();
    });
  }

  async function openLink(url) {
    try { await request("ui/open-link", { url }); }
    catch (e) { /* host refused (e.g. not an official domain) */ }
  }

  // ---- handshake -------------------------------------------------------------------------------
  request("ui/initialize", {
    protocolVersion: PROTOCOL,
    appInfo: { name: "mmp-service-card", version: "0.1.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then((result) => {
    ctx = (result && result.hostContext) || {};
    applyTheme();
    notify("ui/notifications/initialized", {});
    render();
  }).catch(() => {});
  new ResizeObserver(resize).observe(document.getElementById("app"));
})();
</script>
